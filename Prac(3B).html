    <form>
        <fieldset style=" border-color: gold; width: 12cm;>
            <h1 align="center">Sign up form</h1>
            
            <table  >
                <tr>
                    <td>Name:</td>
                    <td><input type="text" id="Name" name="Name" required></td>
                </tr>
               <tr>
                      <td> Email:</td>
                      <td><input type="email" id="Email" name="Email"  placeholder="name@domain.com" required></td>
               </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" id="Password" name="password" required></td>
                </tr>
                     <tr>
                    <td>Phone:</td>
                    <td>
                        <input type="tel" id="phone" name="phone" placeholder="(###) ###-####"  required maxlength="10">
                      
                    </td>
              
                                  <tr>
                    <td>DOB:</td>
                    <td><input type="date" id="DOB" name="DOB" required></td>
                </tr>
                                  <tr>
                        
                    <td><b>Gender</b></td>
                  
                    <td><input type="radio" id="gender" name="Gender" >male</td>
                    <td><input type="radio" id="gender" name="Gender">female</td>
                   
                 </tr> 
               <tr>
              <td> Profile Picture:</td>
              <td><input type="file" id="profile_pic" name="profile_pic" accept="image/*"></td>
            </tr>
               <tr>
                    <td>Country</td>
               <td>
                  <select>
                      <option> </option>
                   <option>India</option>
                   <option>USA</option>
                  <option>Australia</option>
                    <option>France</option>
                       <option>Italy</option>
                    <option>Canada</option>
                   <option>Swizzerland</option>
               </select>
                </td>
               
          <tr>
                    <td>        </td>
                    <td> <input type="checkbox" id="terms_and_conditions" name="terms_and_conditions">terms and conditions</td>
                 </tr>
                  <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit"> 
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
